functional:
  - Система должна позволять двум игрокам одновременно решать одну задачу и видеть код друг друга в реальном времени.
  - Можно создавать игры с другим человеком, с ботом или с другом по ссылке.
  - В системе должны быть рейтинги (очки за неделю, месяц и за всё время).
  - Задачи должны быть доступны на русском и на английском языках.
  - Завершённые игры должны сохраняться и быть доступны для просмотра в режиме «проигрывателя».
  - В системе должен быть чат для зарегистрированных пользователей.

non-functional:
  - Сайт должен быть удобным и оптимизированным по скорости.
  - Сайт должен быть безопасным и защищать данные пользователей.
  - Сайт должен корректно отображаться на мобильных устройствах.
  - Сайт должен работать с последними версиями браузеров.
  - Сайт должен выдерживать нагрузку (например, 1000 одновременных пользователей).

implicit:
  - Пользователи должны иметь возможность регистрироваться и авторизовываться.
  - Система должна проверять решения задач (запускать тесты) и сообщать результат.
  - При создании игры должна быть возможность выбирать уровень сложности.
