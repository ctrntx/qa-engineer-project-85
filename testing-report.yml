- summary: |
    Создание игры с ботом. Пользователь должен иметь возможность создать игру с ботом и начать решать задачу
  status: pass

- summary: |
    Решение задачи и проверка тестов. После отправки кода система должна запустить тесты и показать результат
  status: pass

- summary: |
    Создание игры по ссылке с другим пользователем. Пользователь должен получить ссылку на игру и иметь возможность пригласить другого человека
  status: pass

- summary: |
    Вход с неверным паролем. При неверном логине или пароле система должна показать сообщение об ошибке и не выполнять вход
  status: pass
