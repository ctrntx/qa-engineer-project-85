- summary: |
    Создание игры с ботом
  requirement: |
    Пользователь должен иметь возможность создать игру с ботом и начать решать задачу
  prerequisites: |
    Пользователь зарегистрирован, открыта страница создания игры
  test-data: |
    Режим: «с ботом», уровень: лёгкий
  steps:
    - Открыть страницу создания игры
    - Выбрать режим «с ботом»
    - Выбрать уровень сложности
    - Нажать кнопку создания игры
  expected-result: |
    Игра создана, пользователь попал в лобби, задача отображается в редакторе

- summary: |
    Решение задачи и проверка тестов
  requirement: |
    После отправки кода система должна запустить тесты и показать результат
  prerequisites: |
    Есть активная игра, в редакторе написан код
  test-data: |
    Код: функция, которая корректно решает простую задачу
  steps:
    - Написать код в редакторе
    - Отправить решение / запустить проверку
  expected-result: |
    Тесты пройдены, в интерфейсе отображён результат (PASS / FAIL) и рейтинг

- summary: |
    Создание игры по ссылке с другим пользователем
  requirement: |
    Пользователь должен получить ссылку на игру и иметь возможность пригласить другого человека
  prerequisites: |
    Открыта страница создания игры
  test-data: |
    Выбран режим «с другом по ссылке»
  steps:
    - Выбрать режим «с другом по ссылке»
    - Создать игру
    - Скопировать сгенерированную ссылку
  expected-result: |
    Ссылка сформирована, её можно отправить другому пользователю; при переходе по ней игра открывается

- summary: |
    Вход с неверным паролем
  requirement: |
    При неверном логине или пароле система должна показать сообщение об ошибке и не выполнять вход
  prerequisites: |
    Открыта страница авторизации
  test-data: |
    Логин: корректный, Пароль: неправильный
  steps:
    - Ввести логин
    - Ввести неверный пароль
    - Нажать «Войти»
  expected-result: |
    Появляется сообщение об ошибке, пользователь остаётся на странице авторизации
